name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Тесты by design не трогают SDK и не запускают эмуляторы, поэтому прогон
  # зелёный на голом раннере — и заодно ловит macOS-специфику в коде.
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make
